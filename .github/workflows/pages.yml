name: Deploy CAUCE a GitHub Pages

# Qué se publica lo decide el archivo versionado .github/deploy-target
# ("demo" o "production"); la variable del repositorio CAUCE_DEPLOY_TARGET, si
# existe, tiene prioridad (sirve para volver a la demo sin commit).
#   - "demo": la demostración sin red (comportamiento anterior).
#   - "production": el build conectado a Supabase. Antes de publicar se exige
#     que el proyecto remoto tenga el esquema que este frontend necesita si
#     cambió el código de la aplicación. Cambios sólo estáticos de la encuesta
#     se validan en Pages sin depender de la disponibilidad de Supabase.
# Pasar a producción es un commit revisable (ver PRODUCTION_READINESS.md).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CAUCE_SITE_URL: ${{ vars.CAUCE_SITE_URL || 'https://bitflowapp.github.io/cauce' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      folder: ${{ steps.pick.outputs.folder }}
      target: ${{ steps.target.outputs.target }}
      remote_smoke: ${{ steps.scope.outputs.remote_smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Destino
        id: target
        env:
          VAR_TARGET: ${{ vars.CAUCE_DEPLOY_TARGET }}
        run: |
          target="${VAR_TARGET:-$(tr -d '[:space:]' < .github/deploy-target 2>/dev/null)}"
          case "$target" in demo|production) ;; *) target=demo ;; esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "Destino: $target"
      - name: Alcance de las comprobaciones remotas
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          remote_smoke=true
          if [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" ]]; then
            changed_paths="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            if [[ -n "$changed_paths" ]]; then
              remote_smoke=false
              while IFS= read -r path; do
                case "$path" in
                  encuesta/*|.github/workflows/pages.yml|eslint.config.mjs|service-worker.js|tests/service-worker.test.mjs) ;;
                  *) remote_smoke=true; break ;;
                esac
              done <<< "$changed_paths"
            fi
          fi
          echo "remote_smoke=$remote_smoke" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia desde el lockfile
        run: npm ci
      - name: Compuertas rápidas
        run: |
          npm run lint
          npm run typecheck
          npm run check
          npm test
          npm run test:db
      - name: Esquema remoto compatible (sólo producción)
        if: env.TARGET == 'production' && steps.scope.outputs.remote_smoke == 'true'
        run: node tests/production-smoke.mjs --predeploy
      - name: Build
        id: pick
        run: |
          if [ "$TARGET" = "production" ]; then
            CAUCE_RELEASE="${GITHUB_SHA::7}" npm run build:production
            echo "folder=dist-production" >> "$GITHUB_OUTPUT"
          else
            npm run build
            npm run build:offline
            echo "folder=dist" >> "$GITHUB_OUTPUT"
          fi
      - name: Incluir encuesta estática de CAUCE
        env:
          SITE_FOLDER: ${{ steps.pick.outputs.folder }}
        run: |
          mkdir -p "$SITE_FOLDER/encuesta"
          cp -R encuesta/. "$SITE_FOLDER/encuesta/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pick.outputs.folder }}/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verificar-publicado:
    name: Verificación del sitio publicado
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.build.outputs.target == 'production' && needs.build.outputs.remote_smoke == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke de sólo lectura contra producción
        run: node tests/production-smoke.mjs

  verificar-encuesta:
    name: Verificación pública de la encuesta estática
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: needs.build.outputs.target == 'production' && needs.build.outputs.remote_smoke == 'false'
    steps:
      - name: Comprueba la encuesta y el sitio principal publicados
        env:
          SITE_URL: ${{ vars.CAUCE_SITE_URL || 'https://bitflowapp.github.io/cauce' }}
        run: |
          curl --fail --silent --show-error "$SITE_URL/" --output /dev/null
          curl --fail --silent --show-error "$SITE_URL/encuesta/" | grep -Fq '<title>CAUCE · Aluminé | Encuesta para emprendedores</title>'
          curl --fail --silent --show-error "$SITE_URL/encuesta/app.js" | grep -Fq 'whatsappNumber: "5492942597276"'
          curl --fail --silent --show-error "$SITE_URL/encuesta/assets/images/og-cauce.jpg" --output /dev/null

