name: Deploy CAUCE a GitHub Pages

# Qué se publica lo decide la variable del repositorio CAUCE_DEPLOY_TARGET:
#   - sin definir o "demo": la demostración sin red (comportamiento anterior).
#   - "production": el build conectado a Supabase. Antes de publicar se exige
#     que el proyecto remoto tenga el esquema que este frontend necesita; si
#     faltan migraciones, no se publica nada.
# Así, integrar a main nunca cambia el sitio por accidente: pasar a producción
# es una decisión explícita (ver PRODUCTION_READINESS.md).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TARGET: ${{ vars.CAUCE_DEPLOY_TARGET || 'demo' }}
  CAUCE_SITE_URL: ${{ vars.CAUCE_SITE_URL || 'https://bitflowapp.github.io/cauce' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      folder: ${{ steps.pick.outputs.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia desde el lockfile
        run: npm ci
      - name: Compuertas rápidas
        run: |
          npm run lint
          npm run typecheck
          npm run check
          npm test
          npm run test:db
      - name: Esquema remoto compatible (sólo producción)
        if: env.TARGET == 'production'
        run: node tests/production-smoke.mjs --predeploy
      - name: Build
        id: pick
        run: |
          if [ "$TARGET" = "production" ]; then
            CAUCE_RELEASE="${GITHUB_SHA::7}" npm run build:production
            echo "folder=dist-production" >> "$GITHUB_OUTPUT"
          else
            npm run build
            npm run build:offline
            echo "folder=dist" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pick.outputs.folder }}/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verificar-publicado:
    name: Verificación del sitio publicado
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ (vars.CAUCE_DEPLOY_TARGET || 'demo') == 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke de sólo lectura contra producción
        run: node tests/production-smoke.mjs
