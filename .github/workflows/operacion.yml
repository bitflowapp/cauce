name: Operación de producción

# Pasos de operación del proyecto CAUCE real (scripts/operacion.mjs y
# PRODUCTION_READINESS.md §3): estado, migración, Auth, correo real,
# administración, backup con prueba de restauración y smoke del sitio
# publicado. Los secretos viven en GitHub, nunca se imprimen y nunca se
# escriben en el repositorio. Sin "aplicar" y la confirmación del ref del
# proyecto, ningún paso escribe.
#
# Se pide de tres maneras, siempre con las mismas validaciones:
#   - a mano desde Actions (workflow_dispatch);
#   - con un commit que cambia ops/solicitud.json en la rama de operación o
#     en la de una entrega por integrar (queda auditado en git);
#   - el backup semanal programado.
on:
  workflow_dispatch:
    inputs:
      paso:
        description: Paso a ejecutar
        type: choice
        required: true
        default: estado
        options: [estado, migrar, auth, correo, admin, backup, smoke-previo, smoke-publicado, limpiar-qa, registros]
      aplicar:
        description: Escribir cambios (si no, sólo muestra qué haría)
        type: boolean
        default: false
      confirmar:
        description: Para escribir, repetir el ref del proyecto (ygqbcvxdrewcnzedfcyo)
        type: string
        default: ''
      email:
        description: Paso admin · correo de la cuenta de administración
        type: string
        default: ''
      invitar:
        description: Paso admin · invitar la cuenta si todavía no existe
        type: boolean
        default: false
  schedule:
    - cron: '30 6 * * 1' # lunes 03:30 en Aluminé: backup con prueba de restauración
  # También desde las ramas de las próximas entregas: así el smoke previo y la
  # migración corren con su código contra el proyecto real antes de integrar.
  push:
    branches: [claude/cauce-production-hardening-km1t5s, feat/cauce-business-panel-v1, feat/cauce-rider-v1]
    paths: [ops/solicitud.json]

permissions:
  contents: read

concurrency:
  group: operacion-produccion
  cancel-in-progress: false

jobs:
  operar:
    name: Operación
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: produccion
    env:
      IN_PASO: ${{ inputs.paso }}
      IN_APLICAR: ${{ inputs.aplicar }}
      IN_CONFIRMAR: ${{ inputs.confirmar }}
      IN_EMAIL: ${{ inputs.email }}
      IN_INVITAR: ${{ inputs.invitar }}
      CAUCE_SITE_URL: ${{ vars.CAUCE_SITE_URL || 'https://bitflowapp.github.io/cauce' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CAUCE_SMTP_HOST: ${{ secrets.CAUCE_SMTP_HOST }}
      CAUCE_SMTP_PORT: ${{ secrets.CAUCE_SMTP_PORT }}
      CAUCE_SMTP_USER: ${{ secrets.CAUCE_SMTP_USER }}
      CAUCE_SMTP_PASS: ${{ secrets.CAUCE_SMTP_PASS }}
      CAUCE_SMTP_SENDER: ${{ secrets.CAUCE_SMTP_SENDER }}
      CAUCE_BACKUP_PASSPHRASE: ${{ secrets.CAUCE_BACKUP_PASSPHRASE }}
      # Paso admin: el correo de la administración puede venir del pedido o de
      # este secreto (así no queda en el repositorio y los logs lo ocultan).
      ADMIN_EMAIL_SECRET: ${{ secrets.CAUCE_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Pedido validado
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)
              f=ops/solicitud.json
              paso=$(jq -r '.paso // ""' "$f"); aplicar=$(jq -r '.aplicar // false' "$f")
              confirmar=$(jq -r '.confirmar // ""' "$f"); email=$(jq -r '.email // ""' "$f")
              invitar=$(jq -r '.invitar // false' "$f") ;;
            schedule)
              paso=backup; aplicar=false; confirmar=""; email=""; invitar=false ;;
            *)
              paso="$IN_PASO"; aplicar="$IN_APLICAR"; confirmar="$IN_CONFIRMAR"; email="$IN_EMAIL"; invitar="$IN_INVITAR" ;;
          esac
          [ -z "$email" ] && [ "$paso" = "admin" ] && email="$ADMIN_EMAIL_SECRET"
          # Nada que no pase estas reglas llega al entorno del paso.
          case "$paso" in estado|migrar|auth|correo|admin|backup|smoke-previo|smoke-publicado|limpiar-qa|registros) ;; *) echo "::error::paso inválido"; exit 1 ;; esac
          [[ "$aplicar" =~ ^(true|false)$ && "$invitar" =~ ^(true|false)$ ]] || { echo "::error::aplicar/invitar inválidos"; exit 1; }
          [[ -z "$email" || "$email" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::error::correo inválido"; exit 1; }
          [[ -z "$confirmar" || "$confirmar" =~ ^[a-z]{20}$ ]] || { echo "::error::confirmación inválida"; exit 1; }
          if [ "$aplicar" = "true" ] && [ "$confirmar" != "ygqbcvxdrewcnzedfcyo" ]; then
            echo "::error::Para escribir hay que repetir el ref del proyecto en 'confirmar'."; exit 1
          fi
          # Los smokes crean (y borran) comercios, cuentas y pedidos CAUCE QA en el proyecto real.
          if [[ "$paso" == smoke-* ]] && [ "$aplicar" != "true" ]; then
            echo "::error::El smoke crea y borra datos CAUCE QA: pedirlo con aplicar y confirmar."; exit 1
          fi
          skip=0
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Backup semanal sin SUPABASE_ACCESS_TOKEN: todavía no configurado, no se ejecuta."; skip=1
          fi
          { echo "PASO=$paso"; echo "APLICAR=$aplicar"; echo "INVITAR=$invitar"; echo "CAUCE_ADMIN_EMAIL=$email"; echo "SKIP=$skip"; } >> "$GITHUB_ENV"
          echo "Paso: $paso · aplicar: $aplicar"
      - name: Secretos disponibles (sólo nombres, nunca valores)
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD CAUCE_SMTP_HOST CAUCE_SMTP_PORT CAUCE_SMTP_USER CAUCE_SMTP_PASS CAUCE_SMTP_SENDER CAUCE_BACKUP_PASSPHRASE; do
            if [ -n "${!name}" ]; then echo "✔ $name"; else echo "✘ $name"; fi
          done
          if [ -n "$ADMIN_EMAIL_SECRET" ]; then echo "✔ CAUCE_ADMIN_EMAIL"; else echo "✘ CAUCE_ADMIN_EMAIL"; fi
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia
        if: env.SKIP != '1'
        run: npm ci
      - name: Navegadores para el smoke (antes o después de publicar)
        if: (env.PASO == 'smoke-publicado' || env.PASO == 'smoke-previo') && env.SKIP != '1'
        run: npx playwright install --with-deps chromium webkit
      - name: Paso
        if: env.SKIP != '1'
        run: |
          args=("$PASO")
          [ "$APLICAR" = "true" ] && args+=(--aplicar)
          [ "$INVITAR" = "true" ] && args+=(--invitar)
          if [ "$PASO" = "smoke-publicado" ]; then
            npm run smoke:publicado
          elif [ "$PASO" = "smoke-previo" ]; then
            # El mismo artefacto que después publica Pages, contra el proyecto real.
            npm run build:production
            CAUCE_SMOKE_SITE=build npm run smoke:publicado
          else
            node scripts/operacion.mjs "${args[@]}"
          fi
      - name: Evidencia (sin secretos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operacion-${{ env.PASO }}-${{ github.run_id }}
          path: |
            evidence/operacion-*.json
            evidence/produccion/
          if-no-files-found: ignore
          retention-days: 30
      - name: Copia cifrada de la base (AES-256)
        if: always() && env.PASO == 'backup'
        uses: actions/upload-artifact@v4
        with:
          name: cauce-backup-${{ github.run_id }}
          path: backup/*.gpg
          if-no-files-found: ignore
          retention-days: 30
