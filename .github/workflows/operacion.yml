name: Operación de producción

# Pasos de operación del proyecto CAUCE real (scripts/operacion.mjs y
# PRODUCTION_READINESS.md §3): estado, migración, Auth, correo real,
# administración, backup con prueba de restauración y smoke del sitio
# publicado. Se ejecuta a mano (o el backup semanal). Los secretos viven en
# GitHub, nunca se imprimen y nunca se escriben en el repositorio. Sin
# "aplicar" y la confirmación del ref del proyecto, ningún paso escribe.
on:
  workflow_dispatch:
    inputs:
      paso:
        description: Paso a ejecutar
        type: choice
        required: true
        default: estado
        options: [estado, migrar, auth, correo, admin, backup, smoke-publicado]
      aplicar:
        description: Escribir cambios (si no, sólo muestra qué haría)
        type: boolean
        default: false
      confirmar:
        description: Para escribir, repetir el ref del proyecto (ygqbcvxdrewcnzedfcyo)
        type: string
        default: ''
      email:
        description: Paso admin · correo de la cuenta de administración
        type: string
        default: ''
      invitar:
        description: Paso admin · invitar la cuenta si todavía no existe
        type: boolean
        default: false
  schedule:
    - cron: '30 6 * * 1' # lunes 03:30 en Aluminé: backup con prueba de restauración
  # Sólo para que GitHub registre el workflow desde la rama del PR.
  push:
    branches: [claude/cauce-production-hardening-km1t5s]
    paths: [.github/workflows/operacion.yml]

permissions:
  contents: read

concurrency:
  group: operacion-produccion
  cancel-in-progress: false

jobs:
  registrar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Workflow registrado. Se ejecuta a mano desde Actions → Operación de producción."

  operar:
    if: github.event_name != 'push'
    name: ${{ github.event_name == 'schedule' && 'backup semanal' || inputs.paso }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: produccion
    env:
      PASO: ${{ github.event_name == 'schedule' && 'backup' || inputs.paso }}
      APLICAR: ${{ github.event_name == 'workflow_dispatch' && inputs.aplicar || false }}
      INVITAR: ${{ github.event_name == 'workflow_dispatch' && inputs.invitar || false }}
      CONFIRMAR: ${{ inputs.confirmar }}
      CAUCE_ADMIN_EMAIL: ${{ inputs.email }}
      CAUCE_SITE_URL: ${{ vars.CAUCE_SITE_URL || 'https://bitflowapp.github.io/cauce' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CAUCE_SMTP_HOST: ${{ secrets.CAUCE_SMTP_HOST }}
      CAUCE_SMTP_PORT: ${{ secrets.CAUCE_SMTP_PORT }}
      CAUCE_SMTP_USER: ${{ secrets.CAUCE_SMTP_USER }}
      CAUCE_SMTP_PASS: ${{ secrets.CAUCE_SMTP_PASS }}
      CAUCE_SMTP_SENDER: ${{ secrets.CAUCE_SMTP_SENDER }}
      CAUCE_BACKUP_PASSPHRASE: ${{ secrets.CAUCE_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia
        run: npm ci
      - name: Secretos disponibles (sólo nombres, nunca valores)
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD CAUCE_SMTP_PASS CAUCE_SMTP_SENDER CAUCE_BACKUP_PASSPHRASE; do
            if [ -n "${!name}" ]; then echo "✔ $name"; else echo "✘ $name"; fi
          done
      - name: Validar el pedido
        run: |
          if [ "$APLICAR" = "true" ] && [ "$CONFIRMAR" != "ygqbcvxdrewcnzedfcyo" ]; then
            echo "::error::Para escribir hay que repetir el ref del proyecto en 'confirmar'."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Backup semanal sin SUPABASE_ACCESS_TOKEN: todavía no configurado, no se ejecuta."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Navegadores para el smoke del sitio publicado
        if: env.PASO == 'smoke-publicado' && env.SKIP != '1'
        run: npx playwright install --with-deps chromium webkit
      - name: Paso
        if: env.SKIP != '1'
        run: |
          args=("$PASO")
          [ "$APLICAR" = "true" ] && args+=(--aplicar)
          [ "$INVITAR" = "true" ] && args+=(--invitar)
          if [ "$PASO" = "smoke-publicado" ]; then
            npm run smoke:publicado
          else
            node scripts/operacion.mjs "${args[@]}"
          fi
      - name: Evidencia (sin secretos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operacion-${{ env.PASO }}-${{ github.run_id }}
          path: |
            evidence/operacion-*.json
            evidence/produccion/
          if-no-files-found: ignore
          retention-days: 30
      - name: Copia cifrada de la base (AES-256; la clave no está en GitHub Actions logs)
        if: always() && env.PASO == 'backup'
        uses: actions/upload-artifact@v4
        with:
          name: cauce-backup-${{ github.run_id }}
          path: backup/*.gpg
          if-no-files-found: ignore
          retention-days: 30
