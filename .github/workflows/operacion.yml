name: Operación de Ferias

# Pasos de operación del proyecto Supabase remoto de CAUCE · Ferias
# (scripts/operacion.mjs, docs/OPERACION.md): estado, migración con ensayo
# previo, configuración de Auth, administración y respaldo cifrado con prueba
# de restauración. Sólo a mano (workflow_dispatch): no hay ejecuciones
# programadas. Los secretos viven en el entorno "produccion" de GitHub, nunca
# se imprimen y nunca se escriben en el repositorio. Sin "aplicar" y la
# confirmación del ref del proyecto, ningún paso escribe.
on:
  workflow_dispatch:
    inputs:
      paso:
        description: Paso a ejecutar
        type: choice
        required: true
        default: estado
        options: [estado, migrar, auth, admin, respaldo]
      aplicar:
        description: Escribir cambios (si no, sólo muestra qué haría)
        type: boolean
        default: false
      confirmar:
        description: Para escribir, repetir el ref del proyecto de Ferias
        type: string
        default: ''
      email:
        description: Paso admin · correo de una cuenta ya registrada y confirmada
        type: string
        default: ''
      fotos:
        description: Paso respaldo · incluir los archivos de ferias-media en la copia cifrada
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: operacion-ferias
  cancel-in-progress: false

jobs:
  operar:
    name: Operación
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: produccion
    env:
      IN_PASO: ${{ inputs.paso }}
      IN_APLICAR: ${{ inputs.aplicar }}
      IN_CONFIRMAR: ${{ inputs.confirmar }}
      IN_EMAIL: ${{ inputs.email }}
      IN_FOTOS: ${{ inputs.fotos }}
      # El ref y la dirección del sitio no son secretos: conviene cargarlos como
      # variables del entorno (así los registros los muestran), pero se aceptan
      # también como secretos.
      FERIAS_PROJECT_REF: ${{ vars.FERIAS_PROJECT_REF || secrets.FERIAS_PROJECT_REF }}
      FERIAS_SITE_URL: ${{ vars.FERIAS_SITE_URL || secrets.FERIAS_SITE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      FERIAS_SMTP_HOST: ${{ secrets.FERIAS_SMTP_HOST }}
      FERIAS_SMTP_PORT: ${{ secrets.FERIAS_SMTP_PORT }}
      FERIAS_SMTP_USER: ${{ secrets.FERIAS_SMTP_USER }}
      FERIAS_SMTP_PASS: ${{ secrets.FERIAS_SMTP_PASS }}
      FERIAS_SMTP_SENDER: ${{ secrets.FERIAS_SMTP_SENDER }}
      FERIAS_BACKUP_PASSPHRASE: ${{ secrets.FERIAS_BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Pedido validado
        run: |
          paso="$IN_PASO"; aplicar="$IN_APLICAR"; confirmar="$IN_CONFIRMAR"; email="$IN_EMAIL"; fotos="$IN_FOTOS"
          # Nada que no pase estas reglas llega al entorno del paso.
          case "$paso" in estado|migrar|auth|admin|respaldo) ;; *) echo "::error::Paso inválido."; exit 1 ;; esac
          [[ "$aplicar" =~ ^(true|false)$ && "$fotos" =~ ^(true|false)$ ]] || { echo "::error::aplicar/fotos inválidos."; exit 1; }
          [[ -z "$email" || "$email" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::error::Correo inválido."; exit 1; }
          [[ -z "$confirmar" || "$confirmar" =~ ^[a-z]{20}$ ]] || { echo "::error::La confirmación no tiene la forma de un ref."; exit 1; }
          if [ "$paso" = "admin" ] && [ -z "$email" ]; then echo "::error::El paso admin necesita el correo de la cuenta."; exit 1; fi
          if [ "$aplicar" = "true" ] && { [ -z "$FERIAS_PROJECT_REF" ] || [ "$confirmar" != "$FERIAS_PROJECT_REF" ]; }; then
            echo "::error::Para escribir hay que repetir el ref del proyecto de Ferias en 'confirmar'. No se hizo nada."; exit 1
          fi
          { echo "PASO=$paso"; echo "APLICAR=$aplicar"; echo "CONFIRMAR=$confirmar"; echo "EMAIL=$email"; echo "FOTOS=$fotos"; } >> "$GITHUB_ENV"
          echo "Paso: $paso · aplicar: $aplicar · fotos: $fotos"
      - name: Secretos disponibles (sólo nombres, nunca valores)
        run: |
          for name in FERIAS_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD FERIAS_SITE_URL FERIAS_SMTP_HOST FERIAS_SMTP_PORT FERIAS_SMTP_USER FERIAS_SMTP_PASS FERIAS_SMTP_SENDER FERIAS_BACKUP_PASSPHRASE; do
            if [ -n "${!name}" ]; then echo "✔ $name"; else echo "✘ $name"; fi
          done
      - name: Secretos requeridos por el paso
        run: |
          required=(FERIAS_PROJECT_REF SUPABASE_ACCESS_TOKEN)
          case "$PASO" in
            auth) required+=(FERIAS_SITE_URL) ;;
            respaldo) required+=(FERIAS_BACKUP_PASSPHRASE) ;;
          esac
          missing=()
          for name in "${required[@]}"; do [ -n "${!name}" ] || missing+=("$name"); done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Faltan secretos para '$PASO': ${missing[*]}. Cargarlos en Settings → Environments → produccion (ver docs/OPERACION.md). No se hizo nada."
            exit 1
          fi
          if [ "$FERIAS_PROJECT_REF" = "ygqbcvxdrewcnzedfcyo" ]; then
            echo "::error::FERIAS_PROJECT_REF es el proyecto de CAUCE · Aluminé: Ferias usa un proyecto propio. No se hizo nada."; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalación limpia
        run: npm ci
      - name: Paso
        run: |
          args=("$PASO")
          if [ "$APLICAR" = "true" ]; then args+=(--aplicar --confirmar "$CONFIRMAR"); fi
          if [ "$PASO" = "admin" ]; then args+=(--email "$EMAIL"); fi
          if [ "$PASO" = "respaldo" ] && [ "$FOTOS" = "true" ]; then args+=(--fotos); fi
          node scripts/operacion.mjs "${args[@]}"
      - name: Evidencia (sin secretos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operacion-${{ env.PASO }}-${{ github.run_id }}
          path: evidence/operacion-*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Copia cifrada de la base (AES-256)
        if: always() && env.PASO == 'respaldo'
        uses: actions/upload-artifact@v4
        with:
          name: ferias-respaldo-${{ github.run_id }}
          path: backup/*.gpg
          if-no-files-found: ignore
          retention-days: 30
      - name: Apagar stacks temporales
        if: always() && (env.PASO == 'respaldo' || env.PASO == 'migrar')
        run: |
          docker ps -a --format '{{.Names}}' | grep -E '^supabase_.*_cauce-ferias-(restauracion|ensayo)$' | xargs -r docker rm -f
