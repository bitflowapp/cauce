name: Verificación de rama

# Verifica cualquier rama que no sea main y los pull requests.
# NO publica nada: el despliegue a GitHub Pages sigue siendo exclusivo de
# .github/workflows/pages.yml, que corre sólo en main.
on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobaciones estáticas y compuertas
        run: npm run check

      - name: Instalar dependencias de pruebas fijadas en lockfile
        run: npm ci

      - name: Pruebas de dominio, backend e interfaz
        run: npm test

      - name: Migraciones y aislamiento RLS en PostgreSQL embebido
        run: npm run test:db

      - name: Compilación estática y paquete sin conexión
        run: |
          npm run build
          npm run build:offline

      - name: Recorridos de navegador y auditoría visual
        # Una regresión de navegador debe bloquear la verificación.
        env:
          CAUCE_CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm run e2e
          npm run e2e:demo
          npm run audit:visual
          npm run audit:visual:backend

      - name: Guardar la evidencia de esta corrida
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ github.sha }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
