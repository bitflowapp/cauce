name: CI

# Corre en cada push (incluido main) y en cada pull request. No publica nada:
# el despliegue es exclusivo de pages.yml. Ningún secreto de producción entra
# acá: la integración y los E2E usan un stack Supabase local, efímero, dentro
# del propio runner.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, unitarias, SQL y builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia desde el lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Comprobaciones estáticas y compuertas
        run: npm run check
      - name: Pruebas unitarias
        run: npm test
      - name: Migraciones y RLS en PostgreSQL embebido
        run: npm run test:db
      - name: Builds (demo, demo sin conexión y producción)
        run: |
          npm run build
          npm run build:offline
          npm run build:production

  supabase:
    name: Integración, seguridad y E2E contra Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia desde el lockfile
        run: npm ci
      - name: Stack Supabase local (Postgres, Auth, REST, Storage, Realtime, Mailpit) con las migraciones
        run: npm run db:start
      - name: Integración y seguridad (RLS, multi-comercio, pedidos, auth, storage, realtime)
        run: npm run test:integration
      - name: Navegadores Chromium y WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: E2E en Chromium y WebKit
        run: npm run e2e:local
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-supabase-${{ github.sha }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Apagar el stack
        if: always()
        run: npx supabase stop --no-backup

  demo:
    name: Demostración y backend de desarrollo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalación limpia desde el lockfile
        run: npm ci
      - name: Build de la demostración
        run: npm run build
      - name: Recorridos de navegador y auditoría visual
        env:
          CAUCE_CHROME_PATH: /usr/bin/google-chrome
        run: |
          npm run e2e
          npm run e2e:demo
          npm run audit:visual
          npm run audit:visual:backend
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-demo-${{ github.sha }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
